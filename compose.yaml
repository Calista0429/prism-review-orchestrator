services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism
      POSTGRES_DB: prism
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - prism-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prism']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  prism-data:
